name: Shell and PHP checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install checks
        run: sudo apt-get update && sudo apt-get install --yes php-cli shellcheck

      - name: Check shell scripts
        run: shellcheck zphisher.sh run-docker.sh scripts/launch.sh

      - name: Check PHP templates
        run: find .sites -type f -name '*.php' -print0 | xargs -0 -n1 php -l
